<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Species Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        .nbn-link { color: #2563eb; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body class="m-0 p-0">
    <div id="map"></div>

    <script>
        proj4.defs("EPSG:27700","+proj=tmerc +lat_0=49 +lon_0=-2 +k=0.9996012717 +x_0=400000 +y_0=-100000 +ellps=airy +towgs84=446.448,-125.157,542.06,0.15,0.247,0.842,-20.489 +units=m +no_defs");

        const map = L.map('map').setView([51.45, -2.5], 11);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Geolocation with Heading
        let userMarker = null;
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                const { latitude, longitude, heading } = pos.coords;
                if (!userMarker) {
                    userMarker = L.marker([latitude, longitude], {
                        icon: L.divIcon({
                            html: `<div style="transform: rotate(${heading || 0}deg); font-size: 20px;">➤</div>`,
                            className: 'user-arrow'
                        })
                    }).addTo(map);
                } else {
                    userMarker.setLatLng([latitude, longitude]);
                    userMarker.setIcon(L.divIcon({
                        html: `<div style="transform: rotate(${heading || 0}deg); font-size: 20px;">➤</div>`,
                        className: 'user-arrow'
                    }));
                }
            }, null, { enableHighAccuracy: true });
        }

        const stToWgs84 = (gridStr) => {
            const clean = gridStr.replace(/[^*A-Z0-9]/g, '');
            if (!clean.startsWith('ST')) return null;
            const ref = clean.substring(2);
            let x = 0, y = 0;
            const n = ref.length;
            if (n < 2) return null;
            x = parseInt(ref.substring(0, n/2)) * Math.pow(10, 5 - n/2);
            y = parseInt(ref.substring(n/2)) * Math.pow(10, 5 - n/2);
            const [lng, lat] = proj4("EPSG:27700", "EPSG:4326", [300000 + x, 100000 + y]);
            return [lat, lng];
        };

        fetch('bwspecies.csv')
            .then(res => res.text())
            .then(csv => {
                const rows = csv.split('\n').slice(1);
                rows.forEach(row => {
                    const match = row.match(/^"?([^*",]+)"?,?("?.*?"?)$/);
                    if (!match) return;
                    const coords = stToWgs84(match[1]);
                    if (coords) {
                        const marker = L.circleMarker(coords, { radius: 6, fillColor: "#ef4444", color: "#fff" }).addTo(map);
                        const speciesList = match[2].replace(/"/g, '').split(',').map(s => {
                            const parts = s.trim().split(' [');
                            return { id: parts[0].trim(), name: parts[1] ? parts[1].replace(']', '') : parts[0].trim() };
                        });
                        const listHtml = speciesList.map(s => `<li><a href="https://species.nbnatlas.org/species/${s.id}" target="_blank" class="nbn-link">${s.name}</a></li>`).join('');
                        marker.bindPopup(`<div class="p-2 max-h-60 overflow-y-auto"><p class="font-bold border-b mb-1">Grid: ${match[1]}</p><ul class="text-sm list-disc pl-4">${listHtml}</ul></div>`);
                    }
                });
            });
    </script>
</body>
</html>
