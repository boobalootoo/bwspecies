<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Species Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        .nbn-link { color: #2563eb; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body class="m-0 p-0">
    <div id="map"></div>

    <script>
        proj4.defs("EPSG:27700","+proj=tmerc +lat_0=49 +lon_0=-2 +k=0.9996012717 +x_0=400000 +y_0=-100000 +ellps=airy +towgs84=446.448,-125.157,542.06,0.15,0.247,0.842,-20.489 +units=m +no_defs");

        const map = L.map('map').setView([51.45, -2.5], 11);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        const stToWgs84 = (gridStr) => {
            const clean = gridStr.replace(/\*/g, '');
            const nums = clean.replace(/[^\d]/g, '');
            if (nums.length < 4) return null;
            // Crude parsing for demo; in production use a proper OS Grid parser
            const x = parseInt(nums.substring(0, nums.length/2));
            const y = parseInt(nums.substring(nums.length/2));
            const easting = 300000 + x * 10;
            const northing = 100000 + y * 10;
            const [lng, lat] = proj4("EPSG:27700", "EPSG:4326", [easting, northing]);
            return [lat, lng];
        };

        // Fetch and parse the CSV
        fetch('bwspecies.csv')
            .then(res => res.text())
            .then(csv => {
                const rows = csv.split('\n').slice(1);
                rows.forEach(row => {
                    const match = row.match(/^"?([^*",]+)"?,?("?.*?"?)$/);
                    if (!match) return;
                    
                    const grid = match[1].replace(/\*/g, '');
                    const speciesRaw = match[2].replace(/"/g, '');
                    const coords = stToWgs84(grid);

                    if (coords) {
                        const marker = L.circleMarker(coords, { radius: 6, fillColor: "#ef4444", color: "#fff" }).addTo(map);
                        
                        // Parse species list: "ID [Name], ID"
                        const speciesList = speciesRaw.split(',').map(s => {
                            const parts = s.trim().split(' [');
                            const id = parts[0].trim();
                            const name = parts[1] ? parts[1].replace(']', '') : id;
                            return { id, name };
                        });

                        const listHtml = speciesList.map(s => `
                            <li><a href="https://species.nbnatlas.org/species/${s.id}" target="_blank" class="nbn-link">${s.name}</a></li>
                        `).join('');

                        marker.bindPopup(`
                            <div class="p-2 max-h-60 overflow-y-auto">
                                <p class="font-bold border-b mb-1">Grid: ${grid}</p>
                                <ul class="text-sm list-disc pl-4">${listHtml}</ul>
                            </div>
                        `);
                    }
                });
            });
    </script>
</body>
</html>
