<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Images Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .image-card { transition: transform 0.2s; }
        .image-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2 text-indigo-600">
                <i data-lucide="images" class="w-6 h-6"></i>
                <h1 class="font-bold text-xl tracking-tight hidden sm:block">All Images Extractor</h1>
                <h1 class="font-bold text-xl tracking-tight sm:hidden">Extractor</h1>
            </div>
            <button id="infoBtn" class="flex items-center space-x-1 text-slate-500 hover:text-indigo-600 transition-colors px-3 py-2 rounded-md hover:bg-indigo-50" onclick="alert('Paste a URL to scrape every image tag from that webpage. It uses public CORS proxies to bypass security restrictions.')">
                <i data-lucide="info" class="w-5 h-5"></i>
                <span class="font-medium">Info</span>
            </button>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto px-4 py-8 flex flex-col items-center">
        
        <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8 max-w-3xl">
            <h2 class="text-2xl font-semibold mb-2 text-slate-800">Scrape All Images</h2>
            <p class="text-slate-500 mb-6 text-sm">Paste any URL to extract all standard images found on the page.</p>
            
            <form id="extractForm" class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="link" class="w-5 h-5 text-slate-400"></i>
                    </div>
                    <input type="url" id="urlInput" required placeholder="https://example.com" 
                        class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors sm:text-sm">
                </div>
                <button type="submit" id="submitBtn" class="inline-flex justify-center items-center px-6 py-3 border border-transparent text-sm font-medium rounded-xl shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors disabled:opacity-70 disabled:cursor-not-allowed min-w-[120px]">
                    <span id="btnText">Extract All</span>
                    <i data-lucide="loader-2" id="btnLoader" class="w-5 h-5 ml-2 animate-spin hidden"></i>
                </button>
            </form>

            <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm flex items-start">
                <i data-lucide="alert-circle" class="w-5 h-5 mr-2 flex-shrink-0 mt-0.5"></i>
                <span id="errorText">An error occurred.</span>
            </div>
        </div>

        <!-- Results Header -->
        <div id="resultsHeader" class="hidden w-full flex justify-between items-end mb-4 px-2">
            <div>
                <h3 class="text-xl font-bold text-slate-800">Found Images</h3>
                <p class="text-sm text-slate-500"><span id="imageCount">0</span> images extracted</p>
            </div>
            <button id="copyAllBtn" class="text-sm flex items-center bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 py-2 px-4 rounded-lg transition-colors shadow-sm font-medium">
                <i data-lucide="copy-check" class="w-4 h-4 mr-2"></i> Copy All URLs
            </button>
        </div>

        <!-- Image Grid -->
        <div id="imageGrid" class="w-full grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 hidden pb-12">
            <!-- Images will be injected here -->
        </div>

    </main>

    <script>
        lucide.createIcons();

        const form = document.getElementById('extractForm');
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const imageGrid = document.getElementById('imageGrid');
        const resultsHeader = document.getElementById('resultsHeader');
        const imageCount = document.getElementById('imageCount');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const copyAllBtn = document.getElementById('copyAllBtn');

        let extractedUrls = [];

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            urlInput.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = 'Scanning...';
                btnLoader.classList.remove('hidden');
                errorMessage.classList.add('hidden');
                imageGrid.classList.add('hidden');
                resultsHeader.classList.add('hidden');
                imageGrid.innerHTML = '';
            } else {
                btnText.textContent = 'Extract All';
                btnLoader.classList.add('hidden');
            }
        }

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        async function fetchHtmlSecurely(targetUrl) {
            const proxies = [
                { url: `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`, type: 'json' },
                { url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`, type: 'raw' },
                { url: `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`, type: 'raw' }
            ];

            for (const proxy of proxies) {
                try {
                    const response = await fetch(proxy.url);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    if (proxy.type === 'json') {
                        const data = await response.json();
                        if (data.contents) return data.contents;
                    } else {
                        const text = await response.text();
                        if (text) return text;
                    }
                } catch (e) {
                    console.warn(`Proxy ${proxy.url} failed:`, e);
                }
            }
            throw new Error("All proxy services failed to fetch the URL. The site might be blocking access.");
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const targetUrl = urlInput.value.trim();
            if (!targetUrl) return;

            setLoading(true);
            extractedUrls = [];

            try {
                const baseUrlObj = new URL(targetUrl);
                const htmlContent = await fetchHtmlSecurely(targetUrl);

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');

                const imageSet = new Set();

                // Find all image tags
                const imgTags = doc.querySelectorAll('img');
                imgTags.forEach(img => {
                    // Check standard src and common lazy-loading attributes
                    let src = img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-original');
                    
                    if (src && !src.startsWith('data:image')) { // skip raw base64 data strings for cleanliness
                        try {
                            // Convert relative URLs to absolute URLs
                            const absoluteUrl = new URL(src, baseUrlObj.href).href;
                            imageSet.add(absoluteUrl);
                        } catch (err) {
                            console.warn("Invalid URL format:", src);
                        }
                    }
                });

                // Check for og:image as well
                const ogImage = doc.querySelector('meta[property="og:image"]');
                if (ogImage && ogImage.content) {
                    try {
                        imageSet.add(new URL(ogImage.content, baseUrlObj.href).href);
                    } catch(err){}
                }

                extractedUrls = Array.from(imageSet);

                if (extractedUrls.length === 0) {
                    throw new Error("No valid images found on this page.");
                }

                // Render Grid
                imageCount.textContent = extractedUrls.length;
                
                extractedUrls.forEach(imgUrl => {
                    const card = document.createElement('div');
                    card.className = "image-card bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col group relative";
                    
                    card.innerHTML = `
                        <div class="h-48 w-full bg-slate-100 flex items-center justify-center p-2 relative">
                            <img src="${imgUrl}" alt="Extracted" class="max-h-full max-w-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM5NDBhMWUiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cmVjdCB3aWR0aD0iMTgiIGhlaWdodD0iMTgiIHg9IjMiIHk9IjMiIHJ4PSIyIiByeT0iMiIvPjxjaXJjbGUgY3g9IjkiIGN5PSI5IiByPSIyIi8+PHBhdGggZD0ibTIxIDE1LTMuMDgtNi4xNWEyIDIgMCAwIDAtMy4yMThsLTUuNyA5Ii8+PC9zdmc+'; this.classList.add('opacity-50');">
                            <a href="${imgUrl}" target="_blank" class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white backdrop-blur-[2px]">
                                <i data-lucide="external-link" class="w-8 h-8"></i>
                            </a>
                        </div>
                        <div class="p-3 border-t border-slate-100 bg-slate-50 flex items-center justify-between">
                            <input type="text" value="${imgUrl}" readonly class="text-xs text-slate-500 bg-transparent w-full outline-none mr-2 truncate">
                            <button class="copy-btn text-slate-400 hover:text-indigo-600 transition-colors p-1" data-url="${imgUrl}" title="Copy URL">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    imageGrid.appendChild(card);
                });

                resultsHeader.classList.remove('hidden');
                imageGrid.classList.remove('hidden');
                lucide.createIcons();

                // Add copy event listeners to individual buttons
                document.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const url = e.currentTarget.getAttribute('data-url');
                        copyToClipboard(url, e.currentTarget);
                    });
                });

            } catch (error) {
                showError(error.message || "Failed to fetch or parse the webpage.");
            } finally {
                setLoading(false);
            }
        });

        // Copy all URLs
        copyAllBtn.addEventListener('click', () => {
            if (extractedUrls.length === 0) return;
            const allUrlsText = extractedUrls.join('\n');
            copyToClipboard(allUrlsText, copyAllBtn, `<i data-lucide="check" class="w-4 h-4 mr-2 text-green-600"></i> Copied!`);
        });

        function copyToClipboard(text, buttonElement, successHtml = `<i data-lucide="check" class="w-4 h-4 text-green-600"></i>`) {
            const originalHtml = buttonElement.innerHTML;
            
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                buttonElement.innerHTML = successHtml;
                lucide.createIcons();
                
                setTimeout(() => {
                    buttonElement.innerHTML = originalHtml;
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                alert("Failed to copy!");
            }
        }
    </script>
</body>
</html>
